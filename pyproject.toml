[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "smells"
dynamic = ["version"]
description = "Deterministic Rust, Python, and TypeScript source-pattern smell scanner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "mindful-time" }]
keywords = ["code-quality", "code-smells", "rust", "python", "typescript"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/mindful-time/smells"
Releases = "https://github.com/mindful-time/smells/releases"

[tool.maturin]
bindings = "bin"
strip = true
