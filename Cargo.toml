[package]
name = "smells"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic Rust, Python, and TypeScript source-pattern smell scanner"
license = "MIT"
homepage = "https://github.com/mindful-time/smells"
repository = "https://github.com/mindful-time/smells"
readme = "README.md"
keywords = ["code-quality", "code-smells", "lint", "cli", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "rules/rust-v1.json",
    "rules/rust-v1-guidance.json",
    "rules/python-v1.json",
    "rules/typescript-v1.json",
    "rules/portable-v1-guidance.json",
    "schemas/quality-policy.schema.json",
    "schemas/python-quality-policy.schema.json",
    "schemas/typescript-quality-policy.schema.json",
    "schemas/provider-evidence.schema.json",
    "examples/quality-policy.json",
    "examples/python-quality-policy.json",
    "examples/typescript-quality-policy.json",
    "docs/rust-rule-contracts.md",
    "docs/python-rule-contracts.md",
    "docs/typescript-rule-contracts.md",
    "docs/report-interface.md",
    "docs/provider-evidence.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rayon = "1"
regex = "1"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "=0.174.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
# The lexer requires the same Unicode 17 tables as unicode-properties 0.1.4.
unicode-ident = "=1.0.24"
