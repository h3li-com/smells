[package]
name = "smells"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic Rust, Python, and TypeScript source-pattern smell scanner"
publish = false

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rayon = "1"
regex = "1"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "=0.174.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
# The lexer requires the same Unicode 17 tables as unicode-properties 0.1.4.
unicode-ident = "=1.0.24"
