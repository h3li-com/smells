[package]
name = "smells"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic Rust, Python, and TypeScript source-pattern smell scanner"
license = "MIT"
homepage = "https://github.com/mindful-time/smells"
repository = "https://github.com/mindful-time/smells"
readme = "README.md"
keywords = ["code-quality", "code-smells", "lint", "cli", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "rules/sources-v1.json",
    "rules/concept-catalog-v1.json",
    "rules/rust-v1.json",
    "rules/rust-v1-guidance.json",
    "rules/python-v1.json",
    "rules/typescript-v1.json",
    "rules/portable-v1-guidance.json",
    "rules/when-to-ignore-v1.json",
    "schemas/quality-policy.schema.json",
    "schemas/python-quality-policy.schema.json",
    "schemas/typescript-quality-policy.schema.json",
    "schemas/provider-evidence.schema.json",
    "schemas/source-manifest.schema.json",
    "schemas/concept-catalog.schema.json",
    "examples/quality-policy.json",
    "examples/python-quality-policy.json",
    "examples/typescript-quality-policy.json",
    "docs/rust-rule-contracts.md",
    "docs/python-rule-contracts.md",
    "docs/typescript-rule-contracts.md",
    "docs/report-interface.md",
    "docs/migration-code-analysis.md",
    "docs/architecture.md",
    "docs/provider-evidence.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rayon = "1"
regex = "1"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "=0.174.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
# The lexer requires the same Unicode 17 tables as unicode-properties 0.1.4.
unicode-ident = "=1.0.24"

[dev-dependencies]
jsonschema = { version = "0.58.1", default-features = false }
proptest = "1.11.0"

# Lint set adapted from BeautifulRust (https://github.com/morganlinton/BeautifulRust).
# smells is an application, so the library-only lints (missing_docs and the
# documentation-coverage set) are left out. `make pre-commit-push` runs clippy with
# -D warnings, so every warn here is a gate.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# Left off: as_conversions. The remaining `as` casts are usize/u64 widenings that
# have no From impl; truncation and sign loss are still caught above.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Field names mirror the policy, manifest and report JSON schemas, so renaming them
# to satisfy this lint would break user files.
struct_field_names = "allow"
