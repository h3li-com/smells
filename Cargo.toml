[package]
name = "smells"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic Rust source-pattern smell scanner"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "=0.174.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
# The lexer requires the same Unicode 17 tables as unicode-properties 0.1.4.
unicode-ident = "=1.0.24"
