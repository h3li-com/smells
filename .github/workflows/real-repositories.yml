name: Real repository E2E

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-repositories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-migration-analysis:
    name: static migration analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan pinned real repositories without executing them
        run: make real-repository-e2e

      - name: Preserve real-repository reports
        if: always() && hashFiles('target/real-repositories/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-repository-reports
          path: target/real-repositories/*.json
          if-no-files-found: error
          retention-days: 14
