name: Publish crates.io from release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.5.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish crate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the owner and immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/verify-registry-release.sh "$RELEASE_TAG" \
            >> "$GITHUB_OUTPUT"

      - name: Use the exact released source
        run: git checkout --detach "${{ steps.release.outputs.commit }}"

      - name: Download and verify the signed release crate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir crate-release
          gh release download "$RELEASE_TAG" \
            --pattern "smells-$RELEASE_VERSION.crate" \
            --pattern sha256.sum \
            --dir crate-release
          gh release verify-asset \
            "$RELEASE_TAG" "crate-release/smells-$RELEASE_VERSION.crate"
          gh release verify-asset "$RELEASE_TAG" crate-release/sha256.sum
          grep "  smells-$RELEASE_VERSION.crate$" crate-release/sha256.sum \
            > crate-release/crate.sha256
          (cd crate-release && sha256sum -c crate.sha256)

      - name: Authenticate to crates.io with Trusted Publishing
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish the verified source package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cargo package --locked
          ./scripts/publish-crate.sh \
            "$RELEASE_VERSION" \
            "crate-release/smells-$RELEASE_VERSION.crate" \
            "target/package/smells-$RELEASE_VERSION.crate"

      - name: Verify installation from crates.io
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo install \
                --locked --root target/crates-smoke \
                --version "$RELEASE_VERSION" smells; then
              target/crates-smoke/bin/smells --version
              exit 0
            fi
            sleep 3
          done
          exit 1
