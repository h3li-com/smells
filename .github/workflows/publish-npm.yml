name: Publish npm from release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.4.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish packages
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the owner and immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/verify-registry-release.sh "$RELEASE_TAG" \
            >> "$GITHUB_OUTPUT"

      - name: Use the exact released source
        run: git checkout --detach "${{ steps.release.outputs.commit }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an npm CLI with Trusted Publishing support
        run: |
          npm_version=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) process.exit(1)' "$npm_version"
          npm --version

      - name: Download the signed release npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir npm-dist
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --dir npm-dist
          test "$(find npm-dist -maxdepth 1 -type f -name '*.tgz' \
            | wc -l | tr -d ' ')" -eq 6
          for package in npm-dist/*.tgz; do
            gh release verify-asset "$RELEASE_TAG" "$package"
          done

      - name: Publish native packages, then the root launcher
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node npm/publish-packages.mjs \
            npm-dist "$RELEASE_VERSION" \
            https://registry.npmjs.org \
            --provenance

      - name: Verify the package from npm
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p target/npm-registry-smoke
          printf '%s\n' '{"name":"smells-registry-smoke","private":true}' \
            > target/npm-registry-smoke/package.json
          for attempt in 1 2 3 4 5; do
            if npm install \
                --prefix target/npm-registry-smoke \
                --ignore-scripts --no-audit --no-fund \
                --save-exact "@mindful-time/smells@$RELEASE_VERSION"; then
              target/npm-registry-smoke/node_modules/.bin/smells --version
              exit 0
            fi
            sleep 3
          done
          exit 1
