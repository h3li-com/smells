name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Cargo.toml, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release source and version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"
          test "$GITHUB_REF" = refs/heads/main
          version=$(./scripts/verify-release-tag.sh "$RELEASE_TAG")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "tag already exists: $RELEASE_TAG" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain and quality tools
        run: |
          rustup show active-toolchain
          ./scripts/install-ci-quality-tools.sh

      - name: Run the complete fail-closed gate
        run: make pre-commit-push

  linux:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Build wheel and binary
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        env:
          # glibc 2.17 exposes endian conversion macros through its BSD feature set.
          # https://github.com/tree-sitter/tree-sitter/issues/4186
          CFLAGS: -D_BSD_SOURCE
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2_17"
          maturin-version: v1.14.1
          args: --release --locked --out dist --compatibility pypi

      - name: Smoke-test the native wheel
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv target/wheel-smoke
          target/wheel-smoke/bin/python -m pip install \
            --no-index --find-links dist "smells==$RELEASE_VERSION"
          target/wheel-smoke/bin/smells --version
          target/wheel-smoke/bin/smells --help
          target/wheel-smoke/bin/python -c \
            'from importlib.metadata import distribution; from pathlib import Path; package = distribution("smells"); license_path = next(path for path in package.files or () if path.name == "LICENSE" and path.parent.name == "licenses"); assert package.metadata["License-Expression"] == "MIT"; assert package.locate_file(license_path).read_bytes() == Path("LICENSE").read_bytes()'

      - name: Create standalone archive
        run: |
          ./scripts/package-release.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/smells" \
            release

      - name: Smoke-test the native standalone archive
        run: |
          mkdir -p target/archive-smoke
          tar -xzf "release/smells-${{ matrix.target }}.tar.gz" \
            -C target/archive-smoke
          cmp LICENSE "target/archive-smoke/smells-${{ matrix.target }}/LICENSE"
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --version
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --help

      - name: Smoke-test the npm packages offline
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          ./scripts/smoke-test-npm.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/smells" \
            target/npm-package-smoke \
            "${{ needs.validate.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.whl
            release/*
            target/npm-package-smoke/platform/*.tgz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            python_architecture: x64
          - target: aarch64-apple-darwin
            runner: macos-15
            python_architecture: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Build wheel and binary
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          maturin-version: v1.14.1
          args: --release --locked --out dist --compatibility pypi

      - name: Smoke-test the native wheel
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv target/wheel-smoke
          target/wheel-smoke/bin/python -m pip install \
            --no-index --find-links dist "smells==$RELEASE_VERSION"
          target/wheel-smoke/bin/smells --version
          target/wheel-smoke/bin/smells --help
          target/wheel-smoke/bin/python -c \
            'from importlib.metadata import distribution; from pathlib import Path; package = distribution("smells"); license_path = next(path for path in package.files or () if path.name == "LICENSE" and path.parent.name == "licenses"); assert package.metadata["License-Expression"] == "MIT"; assert package.locate_file(license_path).read_bytes() == Path("LICENSE").read_bytes()'

      - name: Create standalone archive
        run: |
          ./scripts/package-release.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/smells" \
            release

      - name: Smoke-test the native standalone archive
        run: |
          mkdir -p target/archive-smoke
          tar -xzf "release/smells-${{ matrix.target }}.tar.gz" \
            -C target/archive-smoke
          cmp LICENSE "target/archive-smoke/smells-${{ matrix.target }}/LICENSE"
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --version
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --help

      - name: Smoke-test the npm packages offline
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          ./scripts/smoke-test-npm.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/smells" \
            target/npm-package-smoke \
            "${{ needs.validate.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.whl
            release/*
            target/npm-package-smoke/platform/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: x86_64-pc-windows-msvc
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Build wheel and binary
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: x86_64-pc-windows-msvc
          maturin-version: v1.14.1
          args: --release --locked --out dist --compatibility pypi

      - name: Smoke-test the wheel
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv target/wheel-smoke
          target/wheel-smoke/Scripts/python.exe -m pip install `
            --no-index --find-links dist "smells==$env:RELEASE_VERSION"
          target/wheel-smoke/Scripts/smells.exe --version
          target/wheel-smoke/Scripts/smells.exe --help
          target/wheel-smoke/Scripts/python.exe -c `
            'from importlib.metadata import distribution; from pathlib import Path; package = distribution("smells"); license_path = next(path for path in package.files or () if path.name == "LICENSE" and path.parent.name == "licenses"); assert package.metadata["License-Expression"] == "MIT"; assert package.locate_file(license_path).read_bytes() == Path("LICENSE").read_bytes()'

      - name: Create standalone archive
        shell: bash
        run: |
          ./scripts/package-release.sh \
            x86_64-pc-windows-msvc \
            target/x86_64-pc-windows-msvc/release/smells.exe \
            release

      - name: Smoke-test the native standalone archive
        shell: bash
        run: |
          mkdir -p target/archive-smoke
          7z x -bd \
            -otarget/archive-smoke \
            release/smells-x86_64-pc-windows-msvc.zip >/dev/null
          cmp LICENSE target/archive-smoke/smells-x86_64-pc-windows-msvc/LICENSE
          target/archive-smoke/smells-x86_64-pc-windows-msvc/smells.exe --version
          target/archive-smoke/smells-x86_64-pc-windows-msvc/smells.exe --help

      - name: Smoke-test the npm packages offline
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          ./scripts/smoke-test-npm.sh \
            x86_64-pc-windows-msvc \
            target/x86_64-pc-windows-msvc/release/smells.exe \
            target/npm-package-smoke \
            "${{ needs.validate.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            dist/*.whl
            release/*
            target/npm-package-smoke/platform/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [validate, linux, macos, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Revalidate the release actor before publication
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts

      - name: Normalize the downloaded release artifacts
        run: ./scripts/collect-release-artifacts.sh release-artifacts release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Package the crates.io source archive
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo package --locked
          cp "target/package/smells-$RELEASE_VERSION.crate" release/

      - name: Package the root npm launcher
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/package-npm.sh root - release "$RELEASE_VERSION"

      - name: Extract the Cargo dependency SBOM from a wheel
        run: |
          wheel=$(find release -maxdepth 1 -name '*.whl' -print | sort | head -n 1)
          test -n "$wheel"
          unzip -p "$wheel" '*/sboms/*.json' > release/smells.cyclonedx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            release/smells.cyclonedx.json >/dev/null

      - name: Generate the release artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.2
        with:
          path: release
          format: spdx-json
          output-file: release/smells-artifacts.spdx.json
          syft-version: v1.52.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate aggregate checksums
        working-directory: release
        run: |
          : > sha256.sum
          for artifact in *.tar.gz *.zip *.whl *.crate *.tgz *.json; do
            test -e "$artifact" || continue
            sha256sum "$artifact" >> sha256.sum
          done
          sort -o sha256.sum sha256.sum

      - name: Create the immutable GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "Smells $RELEASE_TAG" \
            --generate-notes \
            release/*

      - name: Verify the signed immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release verify "$RELEASE_TAG"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  publish-pypi:
    name: publish to PyPI
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Revalidate the release actor
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"

      - name: Download the signed release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir pypi-dist
          gh release download "$RELEASE_TAG" --pattern '*.whl' --dir pypi-dist

      - name: Publish the wheels with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist
          attestations: true
          skip-existing: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the package from PyPI
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/verify-pypi-release.py "$RELEASE_VERSION" pypi-dist
          python -m venv target/pypi-smoke
          for attempt in 1 2 3 4 5; do
            if target/pypi-smoke/bin/python -m pip install \
                --no-cache-dir --only-binary=:all: "smells==$RELEASE_VERSION"; then
              target/pypi-smoke/bin/smells --version
              exit 0
            fi
            sleep 3
          done
          exit 1

  publish-npm:
    name: publish to npm
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Revalidate the release actor
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an npm CLI with Trusted Publishing support
        run: |
          npm_version=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) process.exit(1)' "$npm_version"
          npm --version

      - name: Download the signed release npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir npm-dist
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --dir npm-dist

      - name: Publish native packages, then the root launcher
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node npm/publish-packages.mjs \
            npm-dist "$RELEASE_VERSION" \
            https://registry.npmjs.org \
            --provenance

      - name: Verify the package from npm
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p target/npm-registry-smoke
          printf '%s\n' '{"name":"smells-registry-smoke","private":true}' \
            > target/npm-registry-smoke/package.json
          for attempt in 1 2 3 4 5; do
            if npm install \
                --prefix target/npm-registry-smoke \
                --ignore-scripts --no-audit --no-fund \
                --save-exact "@mindful-time/smells@$RELEASE_VERSION"; then
              target/npm-registry-smoke/node_modules/.bin/smells --version
              exit 0
            fi
            sleep 3
          done
          exit 1

  publish-github-packages:
    name: publish npm mirror to GitHub Packages
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Revalidate the release actor
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@mindful-time"
          package-manager-cache: false

      - name: Download the signed release npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir github-npm-dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.tgz' \
            --dir github-npm-dist

      - name: Publish the GitHub Packages npm mirror
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node npm/publish-packages.mjs \
            github-npm-dist "$RELEASE_VERSION" \
            https://npm.pkg.github.com

      - name: Verify installation from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p target/github-packages-smoke
          printf '%s\n' '{"name":"smells-github-packages-smoke","private":true}' \
            > target/github-packages-smoke/package.json
          for attempt in 1 2 3 4 5; do
            if npm install \
                --prefix target/github-packages-smoke \
                --ignore-scripts --no-audit --no-fund \
                --save-exact "@mindful-time/smells@$RELEASE_VERSION"; then
              target/github-packages-smoke/node_modules/.bin/smells --version
              exit 0
            fi
            sleep 3
          done
          exit 1

  publish-crates:
    name: publish to crates.io
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Revalidate the release actor
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"

      - name: Download and verify the signed release crate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir crate-release
          gh release download "$RELEASE_TAG" \
            --pattern "smells-$RELEASE_VERSION.crate" \
            --pattern sha256.sum \
            --dir crate-release
          gh release verify-asset \
            "$RELEASE_TAG" "crate-release/smells-$RELEASE_VERSION.crate"
          gh release verify-asset "$RELEASE_TAG" crate-release/sha256.sum
          grep "  smells-$RELEASE_VERSION.crate$" crate-release/sha256.sum \
            > crate-release/crate.sha256
          (cd crate-release && sha256sum -c crate.sha256)

      - name: Publish the verified source package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo package --locked
          ./scripts/publish-crate.sh \
            "$RELEASE_VERSION" \
            "crate-release/smells-$RELEASE_VERSION.crate" \
            "target/package/smells-$RELEASE_VERSION.crate"

      - name: Verify installation from crates.io
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo install \
                --locked --root target/crates-smoke \
                --version "$RELEASE_VERSION" smells; then
              target/crates-smoke/bin/smells --version
              exit 0
            fi
            sleep 3
          done
          exit 1

  registries-required:
    name: registries required
    if: always()
    needs: [publish-pypi, publish-npm, publish-github-packages, publish-crates]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every registry publication
        env:
          CRATES_RESULT: ${{ needs.publish-crates.result }}
          GITHUB_PACKAGES_RESULT: ${{ needs.publish-github-packages.result }}
          NPM_RESULT: ${{ needs.publish-npm.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          test "$CRATES_RESULT" = success
          test "$GITHUB_PACKAGES_RESULT" = success
          test "$NPM_RESULT" = success
