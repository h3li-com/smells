name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Cargo.toml, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release source and version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version=$(./scripts/verify-release-tag.sh "$RELEASE_TAG")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "tag already exists: $RELEASE_TAG" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain and quality tools
        run: |
          rustup show active-toolchain
          ./scripts/install-ci-quality-tools.sh

      - name: Run the complete fail-closed gate
        run: make pre-commit-push

  linux:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel and binary
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2_17"
          maturin-version: v1.14.1
          args: --release --locked --out dist --compatibility pypi

      - name: Smoke-test the native wheel
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv target/wheel-smoke
          target/wheel-smoke/bin/python -m pip install \
            --no-index --find-links dist "smells==$RELEASE_VERSION"
          target/wheel-smoke/bin/smells --version
          target/wheel-smoke/bin/smells --help

      - name: Create standalone archive
        run: |
          ./scripts/package-release.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/smells" \
            release

      - name: Smoke-test the native standalone archive
        run: |
          mkdir -p target/archive-smoke
          tar -xzf "release/smells-${{ matrix.target }}.tar.gz" \
            -C target/archive-smoke
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --version
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.whl
            release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            python_architecture: x64
          - target: aarch64-apple-darwin
            runner: macos-15
            python_architecture: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}

      - name: Build wheel and binary
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          maturin-version: v1.14.1
          args: --release --locked --out dist --compatibility pypi

      - name: Smoke-test the native wheel
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv target/wheel-smoke
          target/wheel-smoke/bin/python -m pip install \
            --no-index --find-links dist "smells==$RELEASE_VERSION"
          target/wheel-smoke/bin/smells --version
          target/wheel-smoke/bin/smells --help

      - name: Create standalone archive
        run: |
          ./scripts/package-release.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/smells" \
            release

      - name: Smoke-test the native standalone archive
        run: |
          mkdir -p target/archive-smoke
          tar -xzf "release/smells-${{ matrix.target }}.tar.gz" \
            -C target/archive-smoke
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --version
          "target/archive-smoke/smells-${{ matrix.target }}/smells" --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.whl
            release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: x86_64-pc-windows-msvc
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build wheel and binary
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: x86_64-pc-windows-msvc
          maturin-version: v1.14.1
          args: --release --locked --out dist --compatibility pypi

      - name: Smoke-test the wheel
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv target/wheel-smoke
          target/wheel-smoke/Scripts/python.exe -m pip install `
            --no-index --find-links dist "smells==$env:RELEASE_VERSION"
          target/wheel-smoke/Scripts/smells.exe --version
          target/wheel-smoke/Scripts/smells.exe --help

      - name: Create standalone archive
        shell: bash
        run: |
          ./scripts/package-release.sh \
            x86_64-pc-windows-msvc \
            target/x86_64-pc-windows-msvc/release/smells.exe \
            release

      - name: Smoke-test the native standalone archive
        shell: bash
        run: |
          mkdir -p target/archive-smoke
          7z x -bd \
            -otarget/archive-smoke \
            release/smells-x86_64-pc-windows-msvc.zip >/dev/null
          target/archive-smoke/smells-x86_64-pc-windows-msvc/smells.exe --version
          target/archive-smoke/smells-x86_64-pc-windows-msvc/smells.exe --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            dist/*.whl
            release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [validate, linux, macos, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Extract the Cargo dependency SBOM from a wheel
        run: |
          wheel=$(find release -maxdepth 1 -name '*.whl' -print | sort | head -n 1)
          test -n "$wheel"
          unzip -p "$wheel" '*/sboms/*.json' > release/smells.cyclonedx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            release/smells.cyclonedx.json >/dev/null

      - name: Generate the release artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.2
        with:
          path: release
          format: spdx-json
          output-file: release/smells-artifacts.spdx.json
          syft-version: v1.52.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate aggregate checksums
        working-directory: release
        run: |
          : > sha256.sum
          for artifact in *.tar.gz *.zip *.whl *.json; do
            test -e "$artifact" || continue
            sha256sum "$artifact" >> sha256.sum
          done
          sort -o sha256.sum sha256.sum

      - name: Create the immutable GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "Smells $RELEASE_TAG" \
            --generate-notes \
            release/*

      - name: Verify the signed immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release verify "$RELEASE_TAG"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
