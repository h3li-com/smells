name: Publish GitHub Packages from release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-github-packages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish npm mirror
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the owner and immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/verify-release-actor.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_ACTOR" \
            "$GITHUB_TRIGGERING_ACTOR"
          test "$GITHUB_REF" = refs/heads/main
          printf '%s\n' "$RELEASE_TAG" \
            | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version=${RELEASE_TAG#v}
          release=$(gh release view "$RELEASE_TAG" \
            --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish)
          test "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isImmutable <<<"$release")" = true
          test "$(jq -r .isPrerelease <<<"$release")" = false
          release_commit=$(jq -r .targetCommitish <<<"$release")
          git cat-file -e "$release_commit^{commit}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$release_commit"
          git merge-base --is-ancestor "$release_commit" HEAD
          manifest_version=$(git show "$release_commit:Cargo.toml" \
            | sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p')
          test "$manifest_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@mindful-time"
          package-manager-cache: false

      - name: Download the signed release npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir github-npm-dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.tgz' \
            --dir github-npm-dist

      - name: Publish the GitHub Packages npm mirror
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node npm/publish-packages.mjs \
            github-npm-dist "$RELEASE_VERSION" \
            https://npm.pkg.github.com

      - name: Verify installation from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p target/github-packages-smoke
          printf '%s\n' '{"name":"smells-github-packages-smoke","private":true}' \
            > target/github-packages-smoke/package.json
          for attempt in $(seq 1 60); do
            if npm install \
                --prefix target/github-packages-smoke \
                --ignore-scripts --no-audit --no-fund \
                --save-exact "@mindful-time/smells@$RELEASE_VERSION"; then
              target/github-packages-smoke/node_modules/.bin/smells --version
              exit 0
            fi
            sleep 5
          done
          exit 1
