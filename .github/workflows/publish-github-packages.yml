name: Publish GitHub Packages from release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.5.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-github-packages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish npm mirror
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the owner and immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/verify-registry-release.sh "$RELEASE_TAG" \
            >> "$GITHUB_OUTPUT"

      - name: Use the exact released source
        run: git checkout --detach "${{ steps.release.outputs.commit }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@mindful-time"
          package-manager-cache: false

      - name: Download the signed release npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          mkdir github-npm-dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.tgz' \
            --dir github-npm-dist
          test "$(find github-npm-dist -maxdepth 1 -type f -name '*.tgz' \
            | wc -l | tr -d ' ')" -eq 6
          for package in github-npm-dist/*.tgz; do
            gh release verify-asset "$RELEASE_TAG" "$package"
          done

      - name: Publish the GitHub Packages npm mirror
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node npm/publish-packages.mjs \
            github-npm-dist "$RELEASE_VERSION" \
            https://npm.pkg.github.com

      - name: Verify installation from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p target/github-packages-smoke
          printf '%s\n' '{"name":"smells-github-packages-smoke","private":true}' \
            > target/github-packages-smoke/package.json
          for attempt in $(seq 1 60); do
            if npm install \
                --prefix target/github-packages-smoke \
                --ignore-scripts --no-audit --no-fund \
                --save-exact "@mindful-time/smells@$RELEASE_VERSION"; then
              target/github-packages-smoke/node_modules/.bin/smells --version
              exit 0
            fi
            sleep 5
          done
          exit 1
